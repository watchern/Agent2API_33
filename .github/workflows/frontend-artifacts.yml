name: frontend-artifacts

# 复核「入库的前端构建产物」可由源码复现。
#
# ── 为什么需要单独一道闸 ──────────────────────────────────────
# 本仓库把构建产物**入库**（`ui/islands/ui.js`、`ui/islands/ui.css`、
# `ui/islands/login.js`、`ui/i18n/**`、`ui/m/**`），而 Tauri 打包的正是 `ui/` 这个静态目录（见 tauri.conf.json 的
# frontendDist）—— 也就是说上线的字节就是仓库里那几份。于是「只改源码不重新构建」
# 与「手改产物」都能一路合进 beta 并被打进安装包，而常规 review 看不出 1.1 MB
# 压缩文件里少了什么。
#
# 2026-10 合并 #228 / #235 时踩到过这个面：两个 PR 各自重建过产物，在 `ui.js` 上
# 必然撞车，而**取任何一边都会静默回退另一边的 UI 改动**（那一次是靠人工核对
# token 集合才判出「产物确实出自源码」）。这道闸把那件事交给机器。
#
# ── 判据：源码必须能完整重建 ──────────────────────────────────
# 不是「对比源码与产物的语义」——那是做不到的。真正的闸是：本作业按 lock 文件
# 装齐依赖后完整重建一遍（含 tsc 类型检查），重建跑挂就直接失败；「源码可被
# 复现」这一点没有放宽。构建可复现已在 Windows 与本工作流的 Linux 上分别验证：
# 两边都产出 LF，且与入库内容一致（入库 blob 也是 LF；仓库没有 .gitattributes，
# Linux 侧 autocrlf 为 false，不会来回转换）。
#
# ── 入库产物允许滞后 ──────────────────────────────────────────
# 上线的 exe 由 build-windows.yml 在打包时重建 ui/ 后编入，用的是那份重建
# 结果，而不是仓库里入库的旧文件。因此「改了源码、入库产物没跟着重建」是
# 正常状态：输出差异清单供核对，但不再阻断发版。真正要盯的异常是「手改产物」
# 「构建多产出/少产出」，这两类仍只能从差异清单里看出来。

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # 依赖不集中在仓库根（根 package.json 没有依赖），三个包各有 lock 文件，
          # 必须显式列全 —— 与 build.yml 的同款说明。
          cache-dependency-path: |
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/mobile/package-lock.json
            desktop-tauri/i18n/package-lock.json

      # ui-kit 也必须装，不是可选项：岛构建以**源码**方式接入它（vite alias 指到
      # ../ui-kit/src），而 ui-kit/styles/globals.css 里 tailwindcss / tw-animate-css /
      # shadcn 三个 @import 要从**它自己**的位置解析（见 vite.config.ts 的注释）。
      # 漏装会样式解析不到、产出的 ui.css 与入库那份不同 —— 报出来是「产物不同源」，
      # 真正的原因却是依赖没装全，排查要多绕一圈。
      - name: 安装依赖
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/mobile ci
          npm --prefix desktop-tauri/i18n ci

      - name: 重建产物
        run: |
          # 岛产物：build 脚本是 `tsc --noEmit && vite build && vite build --config
          # vite.login.config.ts` —— 主面板 ui.js / ui.css 与登录页独立的 login.js
          # 一次出齐，顺带做类型检查
          npm --prefix desktop-tauri/ui-islands run build
          # 手机端产物：同样带类型检查，产物落 ui/m/
          npm --prefix desktop-tauri/mobile run build
          # 多语言词典产物
          npm --prefix desktop-tauri/i18n run build

      - name: 校验产物与源码同源
        run: |
          # status 而不是 diff：它同时覆盖「已入库但被改」「构建新产出但没入库」
          # 「已入库但构建不再产出」三种形态，diff 只能看见第一种。
          changed="$(git status --porcelain -- desktop-tauri/ui)"
          if [ -z "$changed" ]; then
            echo "✅ 入库的构建产物可由源码复现（逐字节相同）"
            exit 0
          fi
          echo "::notice::入库产物与本次重建结果有差异（正常情况：源码领先，产物由打包时重建）"
          echo
          echo "--- 差异文件（M=被改动 / ??=构建新产出未入库 / D=已入库但不再产出）---"
          echo "$changed"
          echo
          echo "--- 内容差异摘要 ---"
          git --no-pager diff --stat -- desktop-tauri/ui
          echo
          # 入库产物允许滞后：前端产物由 build-windows.yml 在**打包时**重建，
          # 上线的 exe 里的字节来自那份重建结果，而不是这里入库的旧文件。
          # 因此「改了源码但没重建入库产物」不再是发版阻断项；本作业仍会
          # 完整重建一遍（tsc 类型检查 + vite 打包），保证「源码可复现」成立 ——
          # 重建本身跑挂了会直接失败，这一层没有放宽。
          # 差异清单保留输出，便于发现「手改产物」「构建多产出/少产出」这类
          # 真正的异常；只有「源码领先、产物滞后」这一正常状态降级为 warning。
          echo "::warning::入库的前端产物滞后于源码（由 build-windows 打包时重建，不影响发版）"
          echo "本作业已完整重建一遍，仅提示差异、不阻断；若 CI 重建出的产物内容与"
          echo "这里列出的差异不符，再按源码排查。产物文件一律由 CI 生成，不要手改。"
          echo "（不要手动编辑 ui/islands/ui.js、ui/islands/login.js、ui/m/** 或 ui/i18n/**）"
